[project]
name = "search-query"
version = "0.1.0"
description = "Experimenting with lark: a search-term grammar with operators"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["lark>=1.2"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/search_query"]
